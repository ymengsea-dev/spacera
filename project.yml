name: Spacera
options:
  bundleIdPrefix: com.spacera
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Spacera:
    type: application
    platform: macOS
    sources:
      - path: Spacera
    info:
      path: Spacera/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
    entitlements:
      path: Spacera/Resources/Spacera.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spacera.Spacera
        PRODUCT_NAME: Spacera
        APP_DISPLAY_NAME: Spacera
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          # Debug builds get their own bundle ID so macOS keeps their Full Disk Access grant apart from
          # the installed app's. Sharing one ID made the installed app ask for access again.
          PRODUCT_BUNDLE_IDENTIFIER: com.spacera.Spacera.debug
          APP_DISPLAY_NAME: Spacera Dev
        Release:
          # Keeps get-task-allow out of Release builds (docs/09-security.md).
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  SpaceraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SpaceraTests
    dependencies:
      - target: Spacera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spacera.SpaceraTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Spacera:
    build:
      targets:
        Spacera: all
        SpaceraTests: [test]
    test:
      targets:
        - SpaceraTests
